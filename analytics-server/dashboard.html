<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMAR — إحصائيات الموقع</title><style>*{box-sizing:border-box}body{background:#0a0a0a;color:#eee;font:16px/1.7 Arial,sans-serif;margin:0;padding:30px}main{max-width:1100px;margin:auto}h1{font-size:30px}h1 span{color:#ff4925}input,button,select{font:inherit;padding:12px;border:1px solid #444;border-radius:9px;background:#191919;color:#eee}button{background:#ff4925;color:#111;border:0;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;margin:30px 0}.card{background:#181818;border:1px solid #333;padding:22px;border-radius:12px}.card strong{font-size:36px;display:block;color:#ff4925}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:right;padding:13px;border-bottom:1px solid #333}small,p{color:#aaa}#error{color:#ff8d73}#login{max-width:400px;margin:80px auto}#login input{width:100%;margin:15px 0}.toolbar{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:25px}[hidden]{display:none!important}</style><main><h1><span>OMAR®</span> — إحصائيات الموقع</h1><form id="login"><h2>دخول الإدارة</h2><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button>دخول</button></form><p id="error" role="status"></p><section id="dashboard" hidden><p>آخر 90 يومًا · الأسماء مدخلة ذاتيًا ولا تثبت هوية الزائر.</p><div class="cards" id="cards"></div><div class="toolbar"><button id="refresh">تحديث</button><select id="filter" aria-label="تصفية الأحداث"><option value="">جميع الأحداث</option><option value="visit">زيارات الموقع</option><option value="name">الأسماء المدخلة</option><option value="social_click">روابط السوشل ميديا</option><option value="work_open">معارض الأعمال</option><option value="external_site_click">المواقع الخارجية</option></select><button id="logout">تسجيل خروج</button></div><p>أحدث 1000 حدث. الزيارات تحسب كل فتح للصفحة، والجلسات تميز جلسات التصفح وليست عدد أشخاص مؤكدًا.</p><div class="scroll"><table><thead><tr><th>الوقت</th><th>الاسم</th><th>الحدث</th><th>الوجهة</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const $=s=>document.querySelector(s),labels={visit:'زيارة الموقع',name:'مشاركة اسم',social_click:'فتح سوشل ميديا',work_open:'فتح معرض أعمال',external_site_click:'فتح موقع خارجي'};let events=[];
function render(){const body=$('#rows');body.replaceChildren();for(const event of events.filter(x=>!$('#filter').value||x.type===$('#filter').value)){const row=document.createElement('tr');for(const value of [new Date(event.created*1000).toLocaleString('ar-IQ'),event.name||'زائر بدون اسم',labels[event.type],event.target||'—']){const cell=document.createElement('td');cell.textContent=value;row.append(cell);}body.append(row);}}
async function load(){try{const r=await fetch('/stats');if(!r.ok){$('#dashboard').hidden=true;$('#login').hidden=false;return;}const d=await r.json();const names={};for(const e of d.events)if(e.name)names[e.session]=e.name;events=d.events.map(e=>({...e,name:e.name||names[e.session]||''}));$('#cards').replaceChildren();for(const [name,n]of [['زيارات الموقع',d.totals.visit||0],['جلسات التصفح',d.sessions],['ضغطات السوشل ميديا',d.totals.social_click||0],['فتح معارض الأعمال',d.totals.work_open||0]]){const card=document.createElement('div');card.className='card';card.textContent=name;const count=document.createElement('strong');count.textContent=n;card.append(count);$('#cards').append(card);}$('#login').hidden=true;$('#dashboard').hidden=false;$('#error').textContent='';render();}catch(e){$('#error').textContent='تعذر الاتصال. حاول مجددًا.';}}
$('#login').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});$('#password').value='';if(!r.ok){$('#error').textContent='تعذر تسجيل الدخول. تحقق من كلمة المرور أو حاول لاحقًا.';return;}load();}catch(e){$('#error').textContent='تعذر الاتصال.';}};$('#refresh').onclick=load;$('#filter').onchange=render;$('#logout').onclick=async()=>{await fetch('/logout',{method:'POST'});events=[];$('#rows').replaceChildren();load();};load();
</script></html>
